name: Tägliches Update

on:
  schedule:
    # Alle 30 Minuten in der Nacht und am Vormittag, sonst alle 2 Stunden. Zeiten sind UTC:
    # 22:00 bis 08:30 UTC = im Winter 23:00 bis 09:30, im Sommer 00:00 bis 10:30 deutscher Zeit.
    # GitHub startet Zeitpläne oft verspätet; viele Einträge sorgen dafür, dass kurz nach dem Aufstehen ein Lauf kommt.
    - cron: "0,30 22,23 * * *"
    - cron: "0,30 0-8 * * *"
    - cron: "0 9-21/2 * * *"   # 09, 11, 13, 15, 17, 19, 21 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Komplette Historie neu holen (z. B. um das Fitness-Alter nachzuladen)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # immer main, auch wenn der Zeitplan vom Standardzweig aus startet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Garmin-Daten abrufen
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python scripts/fetch_garmin.py ${{ inputs.full && '--full' || '' }}

      - name: Website-Daten berechnen
        run: python scripts/build.py

      - name: Daten in Supabase schreiben
        continue-on-error: true   # ein Supabase-Problem darf das Update der Website nicht verhindern
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_GARMIN_CODE: ${{ secrets.SUPABASE_GARMIN_CODE }}
        run: python scripts/sync_supabase.py ${{ inputs.full && '--all' || '' }}

      - name: Geänderte Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          elif [ -z "$(git diff --cached --name-only -- site/data | grep -v '^site/data/meta.json$')" ] \
               && [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 10800 ]; then
            # Nur der Abrufzeitpunkt hat sich geändert und der letzte Commit ist jünger als 3 Stunden:
            # nichts committen (spart Veröffentlichungen), der "Stand" wird spätestens nach 3 Stunden aufgefrischt.
            echo "Keine neuen Werte, Commit übersprungen."
          else
            git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
            # GitHub antwortet beim Push gelegentlich mit "Internal Server Error": bis zu 4 Versuche mit Wartezeit
            for i in 1 2 3 4; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push fehlgeschlagen (Versuch $i von 4), neuer Versuch in $((i * i * 5)) s"
              sleep $((i * i * 5))
              git pull --rebase origin main || git rebase --abort || true
            done
            echo "::error::Push nach 4 Versuchen fehlgeschlagen"
            exit 1
          fi

      # Optional: nur nötig, falls Cloudflare Pages nach dem Commit nicht selbst neu veröffentlicht.
      # Lege dazu das Secret CLOUDFLARE_DEPLOY_HOOK an und entferne die Kommentarzeichen.
      # - name: Cloudflare-Deploy-Hook auslösen
      #   env:
      #     HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
      #   run: curl -fsS -X POST "$HOOK" > /dev/null
