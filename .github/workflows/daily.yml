name: Tägliches Update

on:
  schedule:
    # GitHub startet Zeitpläne in diesem Repo 6 bis 9 Stunden zu spät. Darum liegen die Einträge bewusst
    # nachts (UTC): mit der Verspätung landet der Abruf am Morgen deutscher Zeit. Der Abruf ist idempotent.
    - cron: "30 22 * * *"
    - cron: "30 0 * * *"
    - cron: "0 2 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Komplette Historie neu holen (z. B. um das Fitness-Alter nachzuladen)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # immer main, auch wenn der Zeitplan vom Standardzweig aus startet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Garmin-Daten abrufen
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python scripts/fetch_garmin.py ${{ inputs.full && '--full' || '' }}

      - name: Website-Daten berechnen
        run: python scripts/build.py

      - name: Daten in Supabase schreiben
        continue-on-error: true   # ein Supabase-Problem darf das Update der Website nicht verhindern
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_GARMIN_CODE: ${{ secrets.SUPABASE_GARMIN_CODE }}
        run: python scripts/sync_supabase.py ${{ inputs.full && '--all' || '' }}

      - name: Geänderte Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
            # GitHub antwortet beim Push gelegentlich mit "Internal Server Error": bis zu 4 Versuche mit Wartezeit
            for i in 1 2 3 4; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push fehlgeschlagen (Versuch $i von 4), neuer Versuch in $((i * i * 5)) s"
              sleep $((i * i * 5))
              git pull --rebase origin main || git rebase --abort || true
            done
            echo "::error::Push nach 4 Versuchen fehlgeschlagen"
            exit 1
          fi

      # Optional: nur nötig, falls Cloudflare Pages nach dem Commit nicht selbst neu veröffentlicht.
      # Lege dazu das Secret CLOUDFLARE_DEPLOY_HOOK an und entferne die Kommentarzeichen.
      # - name: Cloudflare-Deploy-Hook auslösen
      #   env:
      #     HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
      #   run: curl -fsS -X POST "$HOOK" > /dev/null
