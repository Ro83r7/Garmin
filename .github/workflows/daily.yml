name: Tägliches Update

on:
  schedule:
    # GitHub-Zeitpläne kennen nur UTC. Je Zielzeit zwei Einträge (Sommer-/Winterzeit);
    # der Schritt "Zeitfenster prüfen" lässt nur den passenden Eintrag laufen.
    - cron: "30 5 * * *"   # 07:30 deutscher Zeit im Sommer
    - cron: "30 6 * * *"   # 07:30 deutscher Zeit im Winter
    - cron: "0 7 * * *"    # 09:00 deutscher Zeit im Sommer
    - cron: "0 8 * * *"    # 09:00 deutscher Zeit im Winter
  workflow_dispatch:
    inputs:
      full:
        description: "Komplette Historie neu holen (z. B. um das Fitness-Alter nachzuladen)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Zeitfenster prüfen
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Manuelle Starts laufen immer. Zeitplan-Starts nur, wenn der Eintrag in deutscher Zeit 07:30 oder 09:00 ist.
          run=true
          if [ -n "$SCHEDULE" ]; then
            set -f; set -- $SCHEDULE; set +f
            off=$(TZ=Europe/Berlin date +%z | sed -E 's/^([+-])0?([0-9]).*/\1\2/')
            local_h=$(( (10#$2 + off + 24) % 24 ))
            case "$local_h:$1" in
              7:30|9:0) run=true ;;
              *) run=false ;;
            esac
            echo "Zeitplan '$SCHEDULE', Versatz $off h, deutsche Zeit $local_h:$1 -> run=$run"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main   # immer main, auch wenn der Zeitplan vom Standardzweig aus startet

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.gate.outputs.run == 'true'
        name: Garmin-Daten abrufen
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python scripts/fetch_garmin.py ${{ inputs.full && '--full' || '' }}

      - if: steps.gate.outputs.run == 'true'
        name: Website-Daten berechnen
        run: python scripts/build.py

      - if: steps.gate.outputs.run == 'true'
        name: Geänderte Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
            git push origin HEAD:main
          fi

      # Optional: nur nötig, falls Cloudflare Pages nach dem Commit nicht selbst neu veröffentlicht.
      # Lege dazu das Secret CLOUDFLARE_DEPLOY_HOOK an und entferne die Kommentarzeichen.
      # - name: Cloudflare-Deploy-Hook auslösen
      #   env:
      #     HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
      #   run: curl -fsS -X POST "$HOOK" > /dev/null
