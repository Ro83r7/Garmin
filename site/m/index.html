<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Garmin Heute</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1220" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garmin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/m/manifest.webmanifest" crossorigin="use-credentials">

<body>
<div class="wrap">
  <header class="hd">
    <h1 id="title">Heute</h1>
    <div class="stand" id="stand">Stand: lädt …</div>
  </header>
  <div id="banners"></div>
  <div id="rangebar" class="seg" role="group" aria-label="Zeitraum" hidden>
    <button type="button" data-r="30" aria-pressed="true">30 Tage</button>
    <button type="button" data-r="90" aria-pressed="false">90 Tage</button>
  </div>
  <section class="view" id="v-heute" aria-label="Heute"></section>
  <section class="view" id="v-herz" aria-label="Herz"></section>
  <section class="view" id="v-schlaf" aria-label="Schlaf"></section>
  <section class="view" id="v-training" aria-label="Training"></section>
  <p class="foot"><span id="foot-icon"></span><span><b>Keine medizinische Bewertung.</b> Ampeln vergleichen dich nur mit deinen eigenen letzten 28 Tagen.</span></p>
  <a class="switch" href="/?view=desktop" id="to-desktop"></a>
  <div class="themes" id="themes"></div>
</div>
<nav class="tabbar" id="tabs" aria-label="Bereiche"></nav>
<script src="/assets/lib.js"></script>
